<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="380" fill="#FFFFFF"/>
  
  <!-- ===== TITLE ===== -->
  <text x="450" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#2C3E50">HealthCheck Architecture</text>
  <line x1="360" y1="62" x2="540" y2="62" stroke="#3498DB" stroke-width="2"/>
  
  <!-- ===== BOXES ===== -->
  
  <!-- HTTPClient -->
  <g transform="translate(20, 100)">
    <rect width="150" height="170" rx="8" fill="#EBF5FB" stroke="#3498DB" stroke-width="2"/>
    <rect width="150" height="36" rx="8" fill="#3498DB"/>
    <polygon points="0,8 8,0 16,8 8,16" fill="#FFFFFF" opacity="0.3"/>
    <text x="75" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">HTTP Client</text>
    <circle cx="30" cy="55" r="14" fill="#3498DB"/>
    <text x="30" y="60" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="600">⬡</text>
    <text x="55" y="59" font-size="13" fill="#2C3E50">GET request</text>
    <text x="55" y="79" font-size="12" fill="#7F8C8D">/liveness · /readiness</text>
    <text x="55" y="97" font-size="12" fill="#7F8C8D">/startup · /health · /ping</text>
    <line x1="15" y1="115" x2="135" y2="115" stroke="#D5E8F0" stroke-width="1"/>
    <text x="75" y="140" text-anchor="middle" font-size="11" fill="#BDC3C7">responds: 200 or 418</text>
  </g>
  
  <!-- HTTPProbeServer -->
  <g transform="translate(210, 100)">
    <rect width="180" height="170" rx="8" fill="#FEF9E7" stroke="#F39C12" stroke-width="2"/>
    <rect width="180" height="36" rx="8" fill="#F39C12"/>
    <polygon points="0,8 8,0 16,8 8,16" fill="#FFFFFF" opacity="0.3"/>
    <text x="90" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">HTTPProbeServer</text>
    <rect x="15" y="55" width="8" height="8" rx="2" fill="#F39C12"/>
    <text x="32" y="63" font-size="12" fill="#2C3E50">Read-only layer</text>
    <text x="32" y="81" font-size="12" fill="#7F8C8D">No state mutation</text>
    <line x1="15" y1="100" x2="165" y2="100" stroke="#FDEBD0" stroke-width="1"/>
    <text x="15" y="125" font-size="11" font-weight="600" fill="#F39C12">5 endpoints:</text>
    <text x="15" y="145" font-size="11" fill="#2C3E50">• GET /liveness</text>
    <text x="15" y="161" font-size="11" fill="#2C3E50">• GET /readiness</text>
    <text x="15" y="177" font-size="11" fill="#2C3E50">• GET /startup</text>
  </g>
  
  <!-- ProbeStateService -->
  <g transform="translate(430, 100)">
    <rect width="180" height="170" rx="8" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="2"/>
    <rect width="180" height="36" rx="8" fill="#1ABC9C"/>
    <polygon points="0,8 8,0 16,8 8,16" fill="#FFFFFF" opacity="0.3"/>
    <text x="90" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">ProbeStateService</text>
    <circle cx="30" cy="58" r="8" fill="none" stroke="#1ABC9C" stroke-width="2"/>
    <circle cx="30" cy="58" r="3" fill="#1ABC9C"/>
    <text x="46" y="62" font-size="12" fill="#2C3E50">GetStatus()</text>
    <circle cx="30" cy="80" r="8" fill="none" stroke="#1ABC9C" stroke-width="2"/>
    <text x="32" y="85" font-size="11" fill="#1ABC9C" font-weight="700">+</text>
    <text x="46" y="84" font-size="12" fill="#2C3E50">SetStateMessage()</text>
    <circle cx="30" cy="102" r="8" fill="none" stroke="#1ABC9C" stroke-width="2"/>
    <text x="31" y="107" font-size="11" fill="#1ABC9C" font-weight="700">−</text>
    <text x="46" y="106" font-size="12" fill="#2C3E50">SetStateError()</text>
    <line x1="15" y1="125" x2="165" y2="125" stroke="#D1F2EB" stroke-width="1"/>
    <text x="15" y="148" font-size="11" fill="#16A085" font-weight="600">*ProbeStatesUnit</text>
    <text x="15" y="165" font-size="10" fill="#7F8C8D">sync.RWMutex</text>
  </g>
  
  <!-- BusinessLogicService -->
  <g transform="translate(650, 100)">
    <rect width="150" height="170" rx="8" fill="#F4ECF7" stroke="#8E44AD" stroke-width="2"/>
    <rect width="150" height="36" rx="8" fill="#8E44AD"/>
    <polygon points="0,8 8,0 16,8 8,16" fill="#FFFFFF" opacity="0.3"/>
    <text x="75" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Biz Logic Service</text>
    <path d="M30,52 L30,82 L42,82" fill="none" stroke="#8E44AD" stroke-width="2"/>
    <polyline points="38,76 42,82 48,76" fill="none" stroke="#8E44AD" stroke-width="2"/>
    <text x="55" y="65" font-size="12" fill="#2C3E50">SetStateMessage()</text>
    <text x="55" y="83" font-size="12" fill="#2C3E50">SetStateError()</text>
    <line x1="15" y1="105" x2="135" y2="105" stroke="#E8DAEF" stroke-width="1"/>
    <text x="75" y="128" text-anchor="middle" font-size="11" fill="#8E44AD" font-weight="600">MonitorService</text>
    <text x="75" y="145" text-anchor="middle" font-size="11" fill="#8E44AD" font-weight="600">Heartbeat Handler</text>
    <text x="75" y="162" text-anchor="middle" font-size="10" fill="#7F8C8D">Injects *ProbeStatesUnit</text>
  </g>
  
  <!-- ===== ARROWS ===== -->
  
  <!-- Client → Server : read arrow -->
  <line x1="170" y1="165" x2="208" y2="165" stroke="#3498DB" stroke-width="2"/>
  <polygon points="208,160 218,165 208,170" fill="#3498DB"/>
  <rect x="180" y="150" width="28" height="18" rx="4" fill="#EBF5FB" stroke="#3498DB" stroke-width="1"/>
  <text x="194" y="163" text-anchor="middle" font-size="10" font-weight="600" fill="#3498DB">read</text>
  
  <!-- Server → State : READ arrow -->
  <line x1="390" y1="165" x2="428" y2="165" stroke="#1ABC9C" stroke-width="2"/>
  <polygon points="428,160 438,165 428,170" fill="#1ABC9C"/>
  <rect x="398" y="148" width="30" height="18" rx="4" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1"/>
  <text x="413" y="161" text-anchor="middle" font-size="10" font-weight="600" fill="#1ABC9C">READ</text>
  
  <!-- Biz → State : write arrow (curved from top) -->
  <path d="M725,100 C725,75 650,75 610,75" fill="none" stroke="#8E44AD" stroke-width="2"/>
  <polygon points="605,70 595,75 605,80" fill="#8E44AD"/>
  <rect x="645" y="63" width="32" height="18" rx="4" fill="#F4ECF7" stroke="#8E44AD" stroke-width="1"/>
  <text x="661" y="76" text-anchor="middle" font-size="10" font-weight="600" fill="#8E44AD">write</text>
  
  <!-- Response arrow Server → Client (dashed below) -->
  <line x1="208" y1="200" x2="170" y2="200" stroke="#E74C3C" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="170,195 160,200 170,205" fill="#E74C3C"/>
  <rect x="175" y="185" width="30" height="18" rx="4" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1"/>
  <text x="190" y="198" text-anchor="middle" font-size="10" font-weight="600" fill="#E74C3C">resp</text>
  
  <!-- Shared note box at bottom -->
  <rect x="280" y="250" width="340" height="100" rx="8" fill="#F8F9FA" stroke="#D5DBDB" stroke-width="1"/>
  <text x="450" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#2C3E50">Shared Instance: *ProbeStatesUnit</text>
  <line x1="320" y1="288" x2="580" y2="288" stroke="#D5DBDB" stroke-width="1"/>
  <text x="450" y="308" text-anchor="middle" font-size="12" fill="#5D6D7E">All components share the same instance — injected at construction time</text>
  <text x="450" y="328" text-anchor="middle" font-size="12" fill="#5D6D7E">Protected by sync.RWMutex for thread-safe concurrent access</text>
  
  <!-- Data flow labels -->
  <text x="80" y="230" font-size="11" font-weight="600" fill="#3498DB" text-anchor="middle">Request Flow</text>
  <text x="80" y="245" font-size="10" fill="#7F8C8D" text-anchor="middle">HTTP GET /{type}</text>
  
  <text x="820" y="230" font-size="11" font-weight="600" fill="#8E44AD" text-anchor="middle">Write Flow</text>
  <text x="820" y="245" font-size="10" fill="#7F8C8D" text-anchor="middle">SetState*</text>

  <!-- Arrow labels on connection lines -->
  <text x="190" y="145" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="600">HTTP GET</text>
  <text x="410" y="145" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="600">Probe Read</text>
</svg>